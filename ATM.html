<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japaniture Bank ATM UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      user-select: none;
      background-color: #0f172a;
    }
    .font-logo {
      font-family: 'Montserrat', sans-serif;
    }
    /* タッチパネル独特のグラデーションとシャドウ */
    .btn-glass {
      background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      box-shadow: 0 4px 0 0 #cbd5e1, 0 8px 16px rgba(0,0,0,0.1);
    }
    .btn-main-primary {
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      box-shadow: 0 6px 0 0 #1e3a8a, 0 10px 20px rgba(37,99,235,0.3);
    }
    .btn-main-dark {
      background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
      box-shadow: 0 6px 0 0 #0f172a, 0 10px 20px rgba(0,0,0,0.3);
    }
    .screen-glass {
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.08);
    }
    .slant-bar {
      transform: skewX(-20deg);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

  <!-- ATM 液晶ディスプレイ外郭フレーム -->
  <div class="w-full max-w-5xl bg-slate-300 rounded-3xl p-3 sm:p-6 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.7)] border-4 border-slate-400">
    
    <!-- 液晶画面エリア -->
    <div class="screen-glass rounded-2xl border-2 border-slate-300 p-6 sm:p-8 flex flex-col justify-between min-h-[640px] relative overflow-hidden">
      
      <!-- 画面上部：ブランディング＆ヘッダーバー -->
      <div class="flex justify-between items-start border-b-2 border-slate-300 pb-5">
        
        <!-- JapanitureMOD ロゴ部分 -->
        <div class="flex flex-col">
          <div class="flex items-baseline font-logo tracking-tighter">
            <span class="text-3xl sm:text-4xl font-extrabold text-black italic">Japaniture</span>
            <span class="text-3xl sm:text-4xl font-extrabold text-black">MOD</span>
          </div>
          <!-- 下部の直線アンダーライン＆右側の斜めバー3本 -->
          <div class="flex items-center mt-1">
            <div class="h-[3px] bg-black w-56 sm:w-64"></div>
            <div class="flex space-x-1 ml-2">
              <div class="w-3 h-3 bg-slate-400 slant-bar"></div>
              <div class="w-3 h-3 bg-slate-500 slant-bar"></div>
              <div class="w-3 h-3 bg-slate-600 slant-bar"></div>
            </div>
          </div>
        </div>

        <!-- 状態 / 言語切り替え -->
        <div class="flex flex-col items-end space-y-2">
          <div class="flex space-x-2">
            <button class="px-4 py-1.5 bg-slate-800 text-white font-bold rounded-lg text-xs shadow">English</button>
            <button class="px-4 py-1.5 bg-slate-200 text-slate-700 font-bold rounded-lg text-xs border border-slate-300">中文 / 한국語</button>
          </div>
          <span class="text-xs font-bold text-slate-500 font-mono tracking-wider">ATM #JPN-0810</span>
        </div>
      </div>

      <!-- メインガイドメッセージ -->
      <div class="my-6 text-center">
        <h1 class="text-2xl sm:text-3xl font-black text-slate-800 tracking-tight">
          ご希望のお取引ボタンを押してください
        </h1>
        <p class="text-slate-500 text-sm font-bold mt-1">
          キャッシュカードまたは通帳をお持ちのお客様はそのままお挿入いただけます
        </p>
      </div>

      <!-- 取引選択ボタンエリア -->
      <div class="grid grid-cols-2 gap-4 sm:gap-6 my-auto">
        
        <!-- お引き出し -->
        <button class="btn-main-primary rounded-2xl p-6 sm:p-8 text-white flex items-center justify-between group transition">
          <div class="text-left">
            <span class="block text-2xl sm:text-4xl font-black tracking-wide">お引き出し</span>
            <span class="text-xs sm:text-sm text-blue-100 font-bold mt-1 block">ご現金のお引出し・定期預金解約</span>
          </div>
          <div class="w-14 h-14 bg-white/10 rounded-xl flex items-center justify-center border border-white/20">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
          </div>
        </button>

        <!-- お預入れ -->
        <button class="btn-main-dark rounded-2xl p-6 sm:p-8 text-white flex items-center justify-between group transition">
          <div class="text-left">
            <span class="block text-2xl sm:text-4xl font-black tracking-wide">お預入れ</span>
            <span class="text-xs sm:text-sm text-slate-300 font-bold mt-1 block">紙幣・硬貨のお預け入れ</span>
          </div>
          <div class="w-14 h-14 bg-white/10 rounded-xl flex items-center justify-center border border-white/20">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
        </button>

        <!-- 残高照会 -->
        <button class="btn-glass rounded-2xl p-5 sm:p-6 text-slate-800 border border-slate-200 flex items-center justify-between">
          <div class="text-left">
            <span class="block text-xl sm:text-2xl font-black">残高照会</span>
            <span class="text-xs text-slate-500 font-bold mt-0.5 block">口座残高・履歴のご確認</span>
          </div>
          <div class="w-10 h-10 bg-slate-200/60 rounded-lg flex items-center justify-center text-slate-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          </div>
        </button>

        <!-- お振込み -->
        <button class="btn-glass rounded-2xl p-5 sm:p-6 text-slate-800 border border-slate-200 flex items-center justify-between">
          <div class="text-left">
            <span class="block text-xl sm:text-2xl font-black">お振込み</span>
            <span class="text-xs text-slate-500 font-bold mt-0.5 block">他行・当行口座へのお振込み</span>
          </div>
          <div class="w-10 h-10 bg-slate-200/60 rounded-lg flex items-center justify-center text-slate-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
          </div>
        </button>

        <!-- 通帳記入・繰越 -->
        <button class="btn-glass rounded-2xl p-5 sm:p-6 text-slate-800 border border-slate-200 flex items-center justify-between">
          <div class="text-left">
            <span class="block text-xl sm:text-2xl font-black">通帳記入 / 繰越</span>
            <span class="text-xs text-slate-500 font-bold mt-0.5 block">通帳の記帳・新通帳発行</span>
          </div>
          <div class="w-10 h-10 bg-slate-200/60 rounded-lg flex items-center justify-center text-slate-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
          </div>
        </button>

        <!-- その他取引 / 暗証番号変更 -->
        <button class="btn-glass rounded-2xl p-5 sm:p-6 text-slate-800 border border-slate-200 flex items-center justify-between">
          <div class="text-left">
            <span class="block text-xl sm:text-2xl font-black">各種変更・その他</span>
            <span class="text-xs text-slate-500 font-bold mt-0.5 block">暗証番号変更・限度額設定など</span>
          </div>
          <div class="w-10 h-10 bg-slate-200/60 rounded-lg flex items-center justify-center text-slate-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
          </div>
        </button>

      </div>

      <!-- 画面下部案内インフォメーション -->
      <div class="border-t-2 border-slate-300 pt-4 flex justify-between items-center text-xs sm:text-sm font-bold text-slate-600">
        <div class="flex items-center space-x-2">
          <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>お取り扱い中（手数料無料時間帯）</span>
        </div>
        <div class="flex space-x-6 text-slate-500">
          <span>インターホン：画面右上</span>
          <span>点字案内対応</span>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
